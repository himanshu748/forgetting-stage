name: Cloud Android preview

on:
  push:
    branches: [codex/nextgen-submission-20260925]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # Standard Linux runners are free for this public repository. No EAS,
    # paid runner, Actions cache, or metered artifact storage is used.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_REVENUECAT_USE_TEST_STORE: 'true'
      EXPO_PUBLIC_REVENUECAT_TEST_API_KEY: ${{ secrets.REVENUECAT_TEST_PUBLIC_KEY }}
      EXPO_PUBLIC_GENERATION_ENDPOINT: ${{ vars.PREVIEW_GENERATION_ENDPOINT }}
      EXPO_PUBLIC_GENERATION_ACCESS_KEY: ${{ secrets.PREVIEW_GENERATION_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify source and preview configuration
        run: |
          test -n "$EXPO_PUBLIC_REVENUECAT_TEST_API_KEY"
          npm test
          npm run typecheck
          git diff --check
      - name: Build standalone cloud-device APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64 -PallowDebugReleaseSigning=true '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g'
      - name: Publish test preview and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p preview-output
          cp android/app/build/outputs/apk/release/app-release.apk preview-output/forgetting-stage-cloud-preview.apk
          cd preview-output
          sha256sum forgetting-stage-cloud-preview.apk > SHA256SUMS.txt
          tag="cloud-preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" forgetting-stage-cloud-preview.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'Cloud Android test preview' --notes 'ARM64 device and x86_64 emulator Android preview for Next Gen demonstration. Debug-signed and configured for simulated RevenueCat Test Store transactions. Not a store release or a production build. Without a configured generation endpoint, the app visibly uses offline rehearsal/preview. Source commit: '"$GITHUB_SHA"
